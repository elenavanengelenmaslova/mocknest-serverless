name: CI - Dependency Submission

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # required to submit the dependency graph to GitHub

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags so `git describe --tags` resolves the project version

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6.3.0
