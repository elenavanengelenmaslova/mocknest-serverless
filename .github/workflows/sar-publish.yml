name: CD - SAR Publish

# Manual-only. We intentionally do NOT use the `release: published` trigger:
# releases cut by the pipeline's default GITHUB_TOKEN cannot trigger other
# workflows anyway, and a manually-published release should not silently kick off
# an unguarded SAR publish. The main-aws.yml pipeline chains SAR publish/test
# directly after a release. Manual dispatch here is restricted to the main branch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for SAR (e.g., 1.0.0 or 0.2.0-beta.1)'
        required: true
        type: string
      aws-region:
        description: 'AWS region for SAR publishing'
        required: false
        default: 'eu-west-1'
        type: string
      github-actions-role-name:
        description: 'GitHub Actions OIDC role name (leave empty to use OIDC_ROLE_NAME secret)'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  # Guard: manual SAR publish/test is only permitted from the protected main branch.
  guard-main:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main-only dispatch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "❌ CD - SAR Publish may only be dispatched from refs/heads/main (got ${GITHUB_REF})."
            exit 1
          fi
          echo "✅ Dispatched from main."

  publish:
    needs: guard-main
    uses: ./.github/workflows/workflow-sar-publish.yml
    with:
      version: ${{ inputs.version }}
      aws-region: ${{ inputs.aws-region || 'eu-west-1' }}
      github-actions-role-name: ${{ inputs.github-actions-role-name || vars.OIDC_ROLE_NAME }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  
  test-api-key:
    needs: publish
    uses: ./.github/workflows/sar-test-pipeline.yml
    with:
      aws-region: ${{ inputs.aws-region || 'eu-west-1' }}
      version: ${{ inputs.version }}
      auth-mode: 'API_KEY'
      github-actions-role-name: ${{ inputs.github-actions-role-name || vars.SAR_TEST_ROLE_NAME || 'GitHubActionsSarTestRole' }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  test-iam:
    needs: publish
    uses: ./.github/workflows/sar-test-pipeline.yml
    with:
      aws-region: ${{ inputs.aws-region || 'eu-west-1' }}
      version: ${{ inputs.version }}
      auth-mode: 'IAM'
      github-actions-role-name: ${{ inputs.github-actions-role-name || vars.SAR_TEST_ROLE_NAME || 'GitHubActionsSarTestRole' }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  summary:
    needs: [publish, test-api-key, test-iam]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Create deployment summary
        env:
          API_KEY_RESULT: ${{ needs.test-api-key.result }}
          APPLICATION_ID: ${{ needs.publish.outputs.application_id }}
          IAM_RESULT: ${{ needs.test-iam.result }}
          REGION: ${{ inputs.aws-region || 'eu-west-1' }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "## 📦 SAR Application Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Region:** ${REGION}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Application ID:** ${APPLICATION_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          # Include test pipeline status for both runs
          echo "### 🧪 Test Pipeline Status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Auth Mode | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          
          if [ "${API_KEY_RESULT}" = "success" ]; then
            echo "| API_KEY | ✅ Passed |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${API_KEY_RESULT}" = "failure" ]; then
            echo "| API_KEY | ❌ Failed |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${API_KEY_RESULT}" = "cancelled" ]; then
            echo "| API_KEY | ⏭️ Cancelled |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| API_KEY | ⚠️ Skipped |" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          if [ "${IAM_RESULT}" = "success" ]; then
            echo "| IAM | ✅ Passed |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${IAM_RESULT}" = "failure" ]; then
            echo "| IAM | ❌ Failed |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${IAM_RESULT}" = "cancelled" ]; then
            echo "| IAM | ⏭️ Cancelled |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| IAM | ⚠️ Skipped |" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          # Overall release status
          if [ "${API_KEY_RESULT}" = "failure" ] || [ "${IAM_RESULT}" = "failure" ]; then
            echo "**Overall Release Status:** ❌ Failed — one or more validation runs failed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${API_KEY_RESULT}" = "success" ] && [ "${IAM_RESULT}" = "success" ]; then
            echo "**Overall Release Status:** ✅ All validation runs passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Overall Release Status:** ⚠️ Incomplete — one or more validation runs were cancelled or skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📊 [View detailed test results](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          echo "### 🎯 Next Steps" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Go to [AWS Serverless Application Repository](https://console.aws.amazon.com/serverlessrepo/home)" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Find 'MockNest-Serverless' in your applications" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Test deployment in your account" >> "$GITHUB_STEP_SUMMARY"
          echo "4. When ready, click 'Make public' to allow others to deploy it" >> "$GITHUB_STEP_SUMMARY"
          echo "5. Repeat for other regions if needed" >> "$GITHUB_STEP_SUMMARY"
