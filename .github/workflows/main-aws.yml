name: CICD - Main Branch AWS

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.kiro/**'
      - 'docs/**'
      - '.github/workflows/sar-*.yml'
      - '.github/workflows/workflow-sar-*.yml'

permissions:
  id-token: write
  contents: read

jobs:
  test:
    uses: ./.github/workflows/workflow-build.yml
    with:
      aws-region: 'eu-west-1'

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      deploy-relevant: ${{ steps.filter.outputs.deploy-relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            deploy-relevant:
              - 'software/**'
              - '!software/**/src/test/**'
              - 'deployment/**'

  deploy:
    needs: [test, detect-changes]
    if: needs.detect-changes.outputs.deploy-relevant == 'true'
    uses: ./.github/workflows/workflow-deploy-aws.yml
    with:
      environment: staging
      aws-region: 'eu-west-1'
      github-actions-role-name: ${{ vars.OIDC_ROLE_NAME }}
      runtime-lambda-memory: 1536
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  # Automated semantic versioning on merge to main. Analyzes Conventional
  # Commits since the last tag and, when a releasable change is present
  # (feat/fix/breaking), creates a bare-semver git tag + GitHub release.
  # Publishing that release triggers sar-publish.yml (on: release: published),
  # which packages/publishes to SAR and runs the API_KEY + IAM SAR tests.
  #
  # IMPORTANT: a release created with the default GITHUB_TOKEN does NOT trigger
  # other workflows (GitHub blocks recursive triggering). To fire sar-publish.yml
  # automatically, provide a Personal Access Token as the RELEASE_PAT secret
  # (repo scope, or a fine-grained token with Contents: read/write). If
  # RELEASE_PAT is absent, the release is still created but SAR publish must be
  # started manually (sar-publish.yml also supports workflow_dispatch).
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: npx --yes semantic-release