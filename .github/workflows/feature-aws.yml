name: CICD - Feature Branch AWS

on:
  push:
    branches:
      - 'feature/*'
      - 'bugfix/*'
      - 'dependabot/**'
    paths-ignore:
      - '**.md'
      - '.kiro/**'
      - 'docs/**'
      - '.github/workflows/sar-*.yml'
      - '.github/workflows/workflow-sar-*.yml'
  # No paths-ignore on pull_request: `test / test` and `test / validate-sam`
  # are required status checks in the main ruleset, so they must report on
  # every PR (including docs-only ones) or the PR can never be merged.
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/workflow-build.yml
    with:
      aws-region: 'eu-west-1'