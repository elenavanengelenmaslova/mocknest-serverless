version: 2

# Consolidate all dependency updates (Gradle + GitHub Actions) into a single PR
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

updates:
  # GitHub Actions dependency updates
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - "*"
    labels:
      - "dependencies"
      - "github-actions"

  # semantic-release toolchain used by the release job in main-aws.yml
  - package-ecosystem: "npm"
    directory: "/.github/release"
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - "*"
    labels:
      - "dependencies"
      - "npm"

  # Gradle dependency updates
  - package-ecosystem: "gradle"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - "*"
    labels:
      - "dependencies"
      - "gradle"
